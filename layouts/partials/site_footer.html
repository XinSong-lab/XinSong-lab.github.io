{{ with site.Params.friendly_links }}
<div class="footer-links">
  <div class="container">
    <h4>Friendly Links</h4>
    <ul class="footer-links-list">
      {{ range . }}
        <li>
          <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>{{ with .affiliation }}<span class="footer-link-aff"> · {{ . }}</span>{{ end }}
        </li>
      {{ end }}
    </ul>
  </div>
</div>
{{ end }}

<div class="copy" >
  <div class="container">
    <p>Copyright 2025 © {{site.Title}} </p>
  </div>
</div>
